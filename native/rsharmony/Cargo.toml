[package]
name = "jidecards_core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
# rustls：纯 Rust TLS，不依赖平台 TLS 库；HarmonyOS 无 native-tls 需要的 OpenSSL/Security Framework，必须用 rustls。
# 双 CA 来源（feature unification 合并）：
#   - anki/rustls 透传 reqwest/rustls-tls-native-roots：从系统根证书库加载（HarmonyOS 沙箱下可能不暴露给 native 进程）
#   - rsharmony 直接启用 reqwest/rustls-tls-webpki-roots：内嵌 Mozilla CA 证书（编译时打包进二进制，不依赖系统）
# 双保险：系统 CA 不可用时 webpki-roots 兜底；系统 CA 可用时两者并存不冲突。
# reqwest workspace 配置 default-features=false，若不开 rustls 则 reqwest 无 TLS backend，
# HTTPS 请求直接报 "error sending request for url"。
anki-core = ["dep:anki", "anki/rustls", "dep:reqwest"]

[dependencies]
prost = "0.13.5"
anki = { path = "../../third_party/anki/rslib", default-features = false, optional = true }
# rsharmony 不直接调用 reqwest API，仅用于把 rustls-tls-webpki-roots feature 透传给 reqwest（与 anki 的 native-roots 合并）。
# 版本与 anki workspace 保持一致（third_party/anki/Cargo.toml），避免 cargo 重复拉两份 reqwest。
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
# 本 crate 不直接使用 tokio，但不能删除：vendored anki rslib 源码调用了
# tokio::io::AsyncReadExt/AsyncWriteExt（sync/http_client/io_monitor.rs 等），
# 而其 workspace 声明的 tokio 特性（fs/rt-multi-thread/macros/signal）不含 io-util。
# 上游完整 workspace 靠其他 crate 做特性统一（feature unification）补齐 io-util；
# 本裁剪 workspace 中只能由这里显式声明，否则 anki-core 特性开启时编译失败。
tokio = { version = "1.45", features = ["io-util"] }
