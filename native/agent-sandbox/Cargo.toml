[package]
name = "jidecards_agent_sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
publish = false

# Keep the sandbox independent of the Anki dependency graph.
[workspace]

[lib]
crate-type = ["rlib", "staticlib"]

[build-dependencies]
sha2 = "=0.10.9"

[dependencies]
wasmi = { version = "=0.47.2", default-features = false, features = ["std"] }
serde_json = "=1.0.145"

[profile.release]
lto = "thin"
strip = "symbols"
