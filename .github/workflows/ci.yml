name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Repository tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run verify -- repo
      - name: Export source and validate the actual copy
        run: |
          npm run export:source -- ../jidecards-source-check
          npm ci --prefix ../jidecards-source-check
          npm --prefix ../jidecards-source-check run verify -- repo

  rust-check:
    name: Rust workspace check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Clone locked Anki source (required for path dependency resolution)
        run: |
          . ./UPSTREAM.lock
          git clone --depth 1 --branch "$ANKI_TAG" "$ANKI_REPOSITORY" third_party/anki
          test "$(git -C third_party/anki rev-parse --short=7 HEAD)" = "$ANKI_RELEASE_COMMIT"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - name: Install protoc (arduino/setup-protoc v3 has no Node 24 release)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check jidecards_core (without anki-core)
        run: cargo check -p jidecards_core
      - name: Run FFI unit tests
        run: cargo test -p jidecards_core
      - name: rustfmt check
        run: cargo fmt -p jidecards_core -- --check
      - name: clippy
        run: cargo clippy -p jidecards_core -- -D warnings
      - name: Verify RPC mapping and locked protocol fingerprint
        run: node tools/verify-rpc-index.mjs
