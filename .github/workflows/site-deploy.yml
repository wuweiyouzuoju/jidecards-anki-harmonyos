name: Deploy jidecards.com

on:
  push:
    branches: [main]
    paths:
      - "hosting/**"
      - "tools/build-site.mjs"
      - "tools/site/**"
      - "tools/site-worker.mjs"
      - "tools/tests/portfolio-site.test.mjs"
      - "tools/tests/site-worker.test.mjs"
      - "AppScope/app.json5"
      - "AppScope/resources/base/media/app_icon.png"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install locked build dependencies
        run: npm ci
      - name: Generate static pages
        run: node tools/build-site.mjs
      - name: Validate public content and domain routing
        run: node --test tools/tests/portfolio-site.test.mjs tools/tests/site-worker.test.mjs
      - name: Check deployment configuration
        id: deployment-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Website build and tests passed; automatic publication is not configured."
            echo "Website build and tests passed. Publication was skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing. Configure both repository secrets to enable automatic deployment; local publication remains available." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy static site to Cloudflare Workers
        if: steps.deployment-config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: deploy --config hosting/wrangler.jsonc
