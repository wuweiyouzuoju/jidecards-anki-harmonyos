name: 功能建议
description: 说明使用场景、当前困难与期待的行为。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前困难
      description: 想完成什么任务，目前在哪一步遇到困难？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期待的行为
      description: 描述操作前后希望发生的变化，尽量给出具体例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有做法与补充信息
      description: 可说明尝试过的替代做法、目标设备或相关资料。
